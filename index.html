<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Spotify Pro</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
    body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
    .logo{width:34px;height:34px;border-radius:50%;background:#1DB954;color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    .search{flex:1;max-width:480px;background:#1f1f1f;border:1px solid transparent;height:40px;border-radius:99px;padding:0 18px;color:#fff;outline:none}
    .search:focus{border-color:#555;background:#282828}
    .btn{background:#fff;color:#000;border:none;padding:8px 16px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
    .btn:hover{background:#1DB954}
    .mid{flex:1;display:flex;gap:8px;padding:0 8px;overflow:hidden}
    .left{width:68px;background:#121212;border-radius:8px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;flex-shrink:0}
    .left img{width:46px;height:46px;border-radius:6px;object-fit:cover;cursor:pointer;background:#282828}
    .center{flex:1;background:linear-gradient(180deg,#202020,#121212 35%);border-radius:8px;padding:20px;overflow-y:auto}
    .chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .chip{background:#282828;color:#fff;border:none;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
    .chip.on,.chip:hover{background:#fff;color:#000}
    .right{width:280px;background:#121212;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:14px}
    .card{background:#181818;padding:14px;border-radius:8px;cursor:pointer;position:relative;transition:.2s}
    .card:hover,.card.on{background:#282828}
    .art{width:100%;aspect-ratio:1/1;border-radius:6px;object-fit:cover;background:#282828;margin-bottom:10px;display:block}
    .play-ic{position:absolute;right:20px;bottom:68px;width:42px;height:42px;border-radius:50%;background:#1DB954;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 6px 14px rgba(0,0,0,.7);opacity:0;transition:.2s}
    .card:hover .play-ic,.card.on .play-ic{opacity:1}
    .bot{height:82px;background:#000;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .ctrls{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:520px}
    .c-btns{display:flex;align-items:center;gap:20px}
    .c-btns button{background:none;border:none;color:#b3b3b3;font-size:16px;cursor:pointer}
    .c-btns button:hover{color:#fff}
    .c-btns .p-main{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;font-size:14px;display:flex;align-items:center;justify-content:center}
    .bar{width:100%;display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
    .bar input{flex:1;accent-color:#1DB954;cursor:pointer}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:99}
    .modal.open{display:flex}
    .mbox{background:#181818;padding:22px;border-radius:12px;width:90%;max-width:360px;display:flex;flex-direction:column;gap:12px}
    .up{border:1px dashed #555;padding:16px;text-align:center;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;background:#222}
    @media(max-width:850px){.right{display:none}}
    @media(max-width:600px){.left{display:none}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="top">
    <div class="logo" onclick="searchMusic('Romania Top Hits')">S</div>
    <input class="search" id="q" placeholder="Caută orice piesă sau artist (apasa Enter)..." onkeydown="if(event.key==='Enter')searchMusic(this.value)">
    <button class="btn" onclick="mod.classList.add('open')">+ MP3 Local</button>
  </div>
  <div class="mid">
    <div class="left" id="side"></div>
    <div class="center">
      <div class="chips">
        <button class="chip on" onclick="setChip(this,'Romania Top Hits')">Top România</button>
        <button class="chip" onclick="setChip(this,'Trap Romanesc')">Trap RO</button>
        <button class="chip" onclick="setChip(this,'Manele Noi')">Manele</button>
        <button class="chip" onclick="setChip(this,'Global Top 50')">Global Hits</button>
        <button class="chip" onclick="setChip(this,'Phonk Drift')">Phonk</button>
      </div>
      <h2 id="secTit">Top România</h2>
      <div class="grid" id="grid"><p style="color:#888;margin-top:20px">Se încarcă melodiile...</p></div>
    </div>
    <div class="right">
      <b style="font-size:14px">Acum se redă</b>
      <img class="art" id="rArt" src="" alt="">
      <h3 id="rTit">Alege o piesă</h3>
      <p id="rSub" style="color:#aaa;font-size:13px">Spotify Pro • Fără reclame</p>
      <div style="background:#181818;padding:14px;border-radius:8px;margin-top:6px;border:1px solid #282828">
        <small style="color:#888">STREAMING LIVE</small>
        <p id="rDesc" style="font-size:13px;color:#ccc;margin-top:6px">Scrie orice melodie în bara de sus și apasă Enter ca să o asculți instant.</p>
      </div>
    </div>
  </div>
  <div class="bot">
    <div style="display:flex;align-items:center;gap:12px;width:28%;min-width:130px">
      <img id="bArt" src="" style="width:50px;height:50px;border-radius:6px;object-fit:cover;background:#222">
      <div style="overflow:hidden"><b id="bTit" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px">Nicio piesă</b><small id="bSub" style="color:#aaa">Spotify Pro</small></div>
    </div>
    <div class="ctrls">
      <div class="c-btns">
        <button onclick="prev()">⏮</button>
        <button class="p-main" id="pBtn" onclick="tog()">▶</button>
        <button onclick="next()">⏭</button>
      </div>
      <div class="bar"><span id="t1">0:00</span><input type="range" id="seek" value="0" oninput="if(au.duration)au.currentTime=(this.value/100)*au.duration"><span id="t2">0:00</span></div>
    </div>
    <div style="width:20%;text-align:right"><input type="range" value="100" style="width:80px;accent-color:#fff" oninput="au.volume=this.value/100"></div>
  </div>
  <div class="modal" id="mod">
    <div class="mbox">
      <h3>Adaugă MP3 din dispozitiv</h3>
      <label class="up">Selectează fișiere MP3<input type="file" accept="audio/*" multiple hidden onchange="addFiles(this.files)"></label>
      <button class="btn" style="background:#282828;color:#fff" onclick="mod.classList.remove('open')">Închide</button>
    </div>
  </div>
  <audio id="au"></audio>
  <script>
    const PIPED=["https://kavin.rocks","https://adminforge.de","https://private.coffee"];
    const AUDIUS="https://audius.co";
    let list=[], idx=-1;

    async function searchMusic(query){
      if(!query.trim())return;
      secTit.innerText=query;
      grid.innerHTML='<p style="color:#888">Se caută muzica...</p>';
      for(let host of PIPED){
        try{
          const r=await fetch(`${host}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
          const d=await r.json();
          if(d.items&&d.items.length){
            list=d.items.slice(0,24).map(x=>({
              t:x.title,a:x.uploaderName||"Artist",img:x.thumbnail,
              vid:x.url.split('v=')[1],host:host,u:null
            }));
            return draw();
          }
        }catch(e){}
      }
      try{
        const r=await fetch(`${AUDIUS}/tracks/search?query=${encodeURIComponent(query)}&limit=24&app_name=SpotifyPro`);
        const d=await r.json();
        list=(d.data||[]).map(x=>({t:x.title,a:x.user?.name||"Artist",img:x.artwork?.['480x480']||"",u:`${AUDIUS}/tracks/${x.id}/stream?app_name=SpotifyPro`}));
        draw();
      }catch(e){grid.innerHTML='<p style="color:#f55">Deschide aplicația de pe link-ul GitHub Pages!</p>';}
    }

    function setChip(el,q){
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      searchMusic(q);
    }

    function draw(){
      grid.innerHTML='';
      side.innerHTML='<button class="btn" style="width:44px;height:44px;padding:0;border-radius:8px;font-size:20px" onclick="mod.classList.add(\'open\')">+</button>';
      list.forEach((s,i)=>{
        if(s.img)side.innerHTML+=`<img src="${s.img}" title="${s.t}" onclick="play(${i})">`;
        grid.innerHTML+=`<div class="card ${i===idx?'on':''}" onclick="play(${i})">
          <img class="art" src="${s.img}" onerror="this.style.background='#282828'">
          <div class="play-ic">${i===idx&&!au.paused?'⏸':'▶'}</div>
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.t}</div>
          <div style="font-size:12px;color:#a7a7a7;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.a}</div>
        </div>`;
      });
    }

    async function play(i){
      if(!list[i])return;
      idx=i; const s=list[i];
      bTit.innerText=rTit.innerText=s.t;
      bSub.innerText=rSub.innerText="Se încarcă sunetul...";
      bArt.src=rArt.src=s.img;
      draw();
      if(!s.u&&s.vid){
        for(let h of [s.host,...PIPED]){
          try{
            const r=await fetch(`${h}/streams/${s.vid}`);
            const d=await r.json();
            const st=d.audioStreams?.sort((a,b)=>b.bitrate-a.bitrate)[0];
